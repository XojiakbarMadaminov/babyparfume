plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyProperties = new Properties()
def releaseKeyFile = rootProject.file('key.properties')
if (releaseKeyFile.exists()) {
    releaseKeyFile.withInputStream { releaseKeyProperties.load(it) }
}

android {
    namespace = "com.babyparfume.babyparfume_mobile"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.babyparfume.babyparfume_mobile"
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseKeyFile.exists()) {
                keyAlias = releaseKeyProperties['keyAlias']
                keyPassword = releaseKeyProperties['keyPassword']
                storeFile = file(releaseKeyProperties['storeFile'])
                storePassword = releaseKeyProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

tasks.configureEach {
    if (name == 'preReleaseBuild') {
        doFirst {
            if (!releaseKeyFile.exists()) {
                throw new GradleException('Release uchun android/key.properties va egasiga tegishli signing kaliti kerak.')
            }
        }
    }
}

flutter {
    source = "../.."
}
